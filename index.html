<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Score Up Web</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: sticky top bar with tabs, single centered column (max 960px); overview is a gauge + trend, other tabs are lists. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#eaeef4; --line:#d9dfe8;
  --ink:#14213d; --ink-2:#4a5775; --ink-3:#7a8499;
  --accent:#e8590c; --accent-ink:#ffffff; --accent-soft:#fdeadd;
  --good:#1f8a5b; --good-soft:#dff3ea; --warn:#b7791f; --warn-soft:#fbefd5; --bad:#c92a3a; --bad-soft:#fbe0e3;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Figtree','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1526; --surface:#16213a; --surface-2:#1e2b49; --line:#2a3858;
  --ink:#eef2fa; --ink-2:#aab6d1; --ink-3:#7886a6;
  --accent:#ff8a4c; --accent-ink:#1a1006; --accent-soft:#3a2314;
  --good:#47c996; --good-soft:#12342a; --warn:#e7b253; --warn-soft:#38290f; --bad:#ff6b79; --bad-soft:#3d1a20;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1526; --surface:#16213a; --surface-2:#1e2b49; --line:#2a3858;
  --ink:#eef2fa; --ink-2:#aab6d1; --ink-3:#7886a6;
  --accent:#ff8a4c; --accent-ink:#1a1006; --accent-soft:#3a2314;
  --good:#47c996; --good-soft:#12342a; --warn:#e7b253; --warn-soft:#38290f; --bad:#ff6b79; --bad-soft:#3d1a20;
  color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding-inline:16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:960px;margin-inline:auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding:10px 16px 0}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:960px;margin-inline:auto}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:20px}
.mark{width:28px;height:28px;border-radius:8px;background:var(--ink);display:grid;place-items:center}
.mark svg{width:16px;height:16px}
.who{display:flex;align-items:center;gap:10px;color:var(--ink-2);font-size:13px;min-width:0}
.who b{color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
nav.tabs{display:flex;gap:2px;max-width:960px;margin:8px auto 0;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:10px 14px;color:var(--ink-2);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.badge{background:var(--bad);color:#fff;border-radius:99px;font-size:11px;min-width:18px;height:18px;padding:0 5px;display:inline-grid;place-items:center;font-weight:600}
main{padding-block:20px 48px}
.note{font-size:12px;color:var(--ink-3);margin-top:20px}
.grid{display:grid;gap:16px}
.hero{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0}
.panel h2{font-size:16px;margin-bottom:12px}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.gauge{display:flex;flex-direction:column;align-items:center;text-align:center}
.gauge svg{width:100%;max-width:300px;height:auto}
.score{font-family:var(--display);font-weight:700;font-size:56px;line-height:1;letter-spacing:-.02em}
.band{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:99px;background:var(--good-soft);color:var(--good);font-weight:600;font-size:13px}
.delta{color:var(--ink-2);font-size:13px;margin-top:8px}
.delta b{color:var(--good)}
.scale{display:flex;width:100%;max-width:300px;height:6px;border-radius:3px;overflow:hidden;margin-top:18px;gap:2px}
.scale i{flex:1}
.scale-l{display:flex;justify-content:space-between;width:100%;max-width:300px;font-size:11px;color:var(--ink-3);margin-top:4px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink-3);font:11px var(--body)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:16px}
.stat{background:var(--surface-2);border-radius:10px;padding:12px}
.stat .v{font-family:var(--display);font-weight:700;font-size:20px;display:block}
.stat .l{font-size:12px;color:var(--ink-2)}
.factor{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line)}
.factor:first-of-type{border-top:0;padding-top:0}
.factor .t{font-weight:600}
.factor .d{grid-column:1/-1;color:var(--ink-2);font-size:13px}
.pill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap;align-self:start}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.mute{background:var(--surface-2);color:var(--ink-2)}
.next{display:flex;gap:14px;align-items:center;background:var(--accent-soft);border-radius:10px;padding:12px 14px;margin-top:16px}
.next .d{font-family:var(--display);font-weight:700;font-size:22px;line-height:1;text-align:center;color:var(--accent);flex:none;width:44px}
.next .d small{display:block;font:600 11px var(--body);text-transform:uppercase}
.next p{margin:0;font-size:13px;color:var(--ink-2)}
.next b{color:var(--ink);font-size:15px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-size:13px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:grid;gap:12px}
.loan{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;gap:12px}
.loan.late{border-color:var(--bad)}
.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.row h3{font-size:17px}
.sub{color:var(--ink-2);font-size:13px}
.meter{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:4px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kv div{min-width:0}
.kv .l{font-size:12px;color:var(--ink-3);display:block}
.kv .v{font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;font-weight:600;font-size:13px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sw{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);cursor:pointer}
.sw input{position:absolute;opacity:0}
.sw span.t{width:34px;height:20px;background:var(--line);border-radius:10px;position:relative;transition:background .15s}
.sw span.t::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked+span.t{background:var(--good)}
.sw input:checked+span.t::after{transform:translateX(14px)}
.sw input:focus-visible+span.t{outline:2px solid var(--accent);outline-offset:2px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:520px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:600;padding:8px 12px;border-bottom:1px solid var(--line)}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.alert{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:14px 0;border-top:1px solid var(--line)}
.alert:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;margin-top:6px}
.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}.dot.info{background:var(--ink-3)}
.alert.read .dot{opacity:.35}
.alert p{margin:0}
.empty{color:var(--ink-2);text-align:center;padding:28px 0}
.auth{min-height:calc(100vh - 32px);display:grid;place-items:center;padding-block:24px}
.auth-card{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px}
.auth-card .brand{margin-bottom:20px}
.auth-card h1{font-size:26px;margin-bottom:6px}
.auth-card p.lead{color:var(--ink-2);margin:0 0 20px}
.demo{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:18px;font-weight:500}
.steps{display:flex;gap:6px;margin-bottom:18px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--surface-2)}
.steps i.on{background:var(--accent)}
.field{display:grid;gap:5px;margin-bottom:14px}
.field label{font-size:13px;font-weight:600}
.field input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
.field input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.field .err{color:var(--bad);font-size:12px;min-height:0}
.field.bad input{border-color:var(--bad)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink-2);margin-bottom:14px}
.check input{margin-top:3px;accent-color:var(--accent)}
.btn.wide{width:100%;padding:11px 14px;font-size:15px}
.swap{text-align:center;margin-top:16px;font-size:14px;color:var(--ink-2)}
.swap button{background:none;border:0;color:var(--accent);font-weight:600;padding:0}
.codebox{letter-spacing:.5em;text-align:center;font-size:22px}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2)}
.calc{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px;align-items:start}
.calc .field input,.calc .field select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
.combo{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.combo select{width:auto!important}
.affix{position:relative}
.affix input{padding-right:52px!important}
.affix span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:13px;pointer-events:none}
.seg-wrap{border:0;padding:0;margin:0 0 6px;min-width:0}
.seg-wrap legend{font-size:13px;font-weight:600;padding:0;margin-bottom:5px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface-2);border-radius:10px;padding:4px}
.seg label{position:relative;text-align:center;padding:8px 6px;border-radius:7px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer}
.seg label:has(input:checked){background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.12)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:1px}
.hint{font-size:12px;color:var(--ink-3);margin:0 0 14px}
.big{font-family:var(--display);font-weight:700;font-size:36px;line-height:1.1;letter-spacing:-.02em}
.split{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:14px 0 6px;background:var(--surface-2)}
.split i{display:block;height:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.compare{background:var(--surface-2);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--ink-2);margin-top:14px}
.sched td,.sched th{text-align:right;white-space:nowrap}
.sched td:first-child,.sched th:first-child{text-align:left}
.me{display:flex;align-items:center;gap:10px;background:none;border:0;padding:2px 2px 2px 8px;border-radius:99px;min-width:0}
.me:hover{background:var(--surface-2)}
.me[aria-current="page"] .avatar{box-shadow:0 0 0 2px var(--accent)}
.prof{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,7fr);gap:16px;align-items:start}
.idcard{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.avatar.lg{width:72px;height:72px;font-size:26px;font-family:var(--display);font-weight:700;margin-bottom:6px}
.idcard h2{font-size:20px;margin:0}
.facts{display:grid;gap:0;margin-top:14px;width:100%;text-align:left}
.facts div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.facts dt{color:var(--ink-2);margin:0}.facts dd{margin:0;font-weight:600;text-align:right}
.prof .field input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
.prof .field input[readonly]{color:var(--ink-2);background:var(--surface-2)}
.saved{color:var(--good);font-size:13px;font-weight:600}
.formrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tip-you{display:grid;gap:10px}
.tip-card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c,var(--ink-3));border-radius:12px;padding:14px 16px}
.tip-card .ic{grid-row:span 2;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--cs,var(--surface-2));color:var(--c,var(--ink-2));font-weight:700;font-size:14px}
.tip-card b{font-size:15px}
.tip-card p{margin:0;color:var(--ink-2);font-size:13px}
.tip-card .btn{grid-column:2;justify-self:start;margin-top:6px}
.tip-group{margin-top:16px}
.tip-group h2{margin-bottom:4px}
details.tip{border-top:1px solid var(--line)}
details.tip:first-of-type{border-top:0}
details.tip summary{cursor:pointer;padding:12px 0;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.tip summary::-webkit-details-marker{display:none}
details.tip summary::after{content:"+";color:var(--ink-3);font-weight:400;font-size:18px;line-height:1}
details.tip[open] summary::after{content:"−"}
details.tip ul{margin:0 0 12px;padding-left:20px;color:var(--ink-2);font-size:14px}
details.tip li{margin-bottom:6px}
.lang{display:inline-flex;gap:2px;background:var(--surface-2);border-radius:99px;padding:2px}
.lang button{border:0;background:none;border-radius:99px;padding:3px 9px;font-size:12px;font-weight:600;color:var(--ink-2)}
.lang button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.15)}
.lang-top{display:flex;justify-content:flex-end;margin-bottom:12px}
@media (max-width:720px){
  .who{gap:6px}
  .btn.ghost{padding:7px 8px;white-space:nowrap}
  .prof{grid-template-columns:minmax(0,1fr)}
  .calc{grid-template-columns:minmax(0,1fr)}
  .hero{grid-template-columns:minmax(0,1fr)}
  .who span.n{display:none}
  .score{font-size:48px}
}
@media (max-width:480px){.brand .bt{display:none}.auth-card .brand .bt{display:inline}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="auth wrap" id="auth" hidden></div>

<header class="top" id="appHeader" hidden>
  <div class="bar">
    <div class="brand">
      <div class="mark" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none"><path d="M2 12l4-4 3 3 5-6" stroke="#ff8a4c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>

</header>

function t(key,vars={}){
  let v=I18N[lang][key]; if(v===undefined) v=I18N.en[key]; if(v===undefined) return key;
  if(typeof v==='object'&&!Array.isArray(v)){ const cat=new Intl.PluralRules(LOC()).select(Number(vars.n)); v=v[cat]||v.other; }
  return typeof v==='string' ? v.replace(/\{(\w+)\}/g,(m,k)=>k in vars?vars[k]:m) : v;
}
function langSwitch(){
  return `<div class="lang" role="group" aria-label="${esc(t('nav.lang'))}">${Object.entries(LANGS).map(([k,l])=>`<button type="button" data-lang="${k}" aria-pressed="${k===lang}" lang="${k}" title="${l.name}">${l.label}</button>`).join('')}</div>`;
}

  document.documentElement.lang=lang;

const nf = n => lang==='hy' ? new Intl.NumberFormat('en-US').format(Math.round(n)).replace(/,/g,'\u00a0') : new Intl.NumberFormat(LOC()).format(Math.round(n));
const monShort = d => lang==='hy' ? HY_MON[new Date(d).getMonth()] : new Date(d).toLocaleDateString(LOC(),{month:'short'});
const amd = n => nf(n)+' '+t('cur');
const fmtDate = d => { const x=new Date(d); return lang==='hy' ? `${x.getDate()} ${HY_MON[x.getMonth()]} ${x.getFullYear()}` : x.toLocaleDateString(LOC(),{day:'numeric',month:'short',year:'numeric'}); };
const daysUntil = d => Math.round((new Date(d)-TODAY)/864e5);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BANDS = [[300,579,'Poor','bad'],[580,669,'Fair','warn'],[670,739,'Good','good'],[740,799,'Very good','good'],[800,850,'Excellent','good']];
const bandOf = s => BANDS.find(b=>s>=b[0]&&s<=b[1]);

let state = {tab:'overview', loanFilter:'all'};
function applyPrefs(saved){
  if(!saved) return;
  if(saved.remind) LOANS.forEach(l=>{ if(l.id in saved.remind) l.remind=saved.remind[l.id]; });
  if(saved.paid) LOANS.forEach(l=>{ if(saved.paid.includes(l.id)) markPaid(l,true); });
  if(saved.read) ALERTS.forEach(a=>{ if(saved.read.includes(a.id)) a.read=true; });
}
if(!sb){ try{ applyPrefs(JSON.parse(localStorage.getItem('scoreup-web')||'{}')); }catch(e){} }
function persist(){
  const p={remind:Object.fromEntries(LOANS.map(l=>[l.id,l.remind])),
    paid:LOANS.filter(l=>l.paidNow).map(l=>l.id),
    read:ALERTS.filter(a=>a.read).map(a=>a.id)};
  if(sb){
    if(user&&user.id) sb.from('user_state').upsert({user_id:user.id,reminders:p.remind,paid_loans:p.paid,read_alerts:p.read,updated_at:new Date().toISOString()})
      .then(({error})=>{ if(error) console.error('Could not save to the database:',error.message); });
    return;
  }
  try{ localStorage.setItem('scoreup-web',JSON.stringify(p)); }catch(e){}
}
function markPaid(l,silent){
  if(l.paidNow) return;
  l.paidNow=true; l.status='current'; l.daysLate=0;
  l.balance=Math.max(0,l.balance-l.monthly);
  const d=new Date(l.next); d.setMonth(d.getMonth()+1); l.next=d.toISOString().slice(0,10);
  if(l.id==='L3'){ const a=ALERTS.find(x=>x.id==='A1'); if(a){a.read=true;a.paid=true;a.level='info';} }
}

/* ---------- Score gauge & chart ---------- */
function gauge(score){
  const cx=150,cy=140,r=112,min=300,max=850;
  const pt=(v,rad=r)=>{const a=Math.PI*(1-(v-min)/(max-min));return [cx+rad*Math.cos(a),cy-rad*Math.sin(a)];};
  const arc=(a,b)=>{const [x1,y1]=pt(a),[x2,y2]=pt(b);return `M${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`;};
  const [kx,ky]=pt(score);
  return `<svg viewBox="0 0 300 160" role="img" aria-label="${esc(t('ov.gauge',{s:score}))}">
    <path d="${arc(min,max)}" stroke="var(--surface-2)" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="${arc(min,score)}" stroke="var(--accent)" stroke-width="16" fill="none" stroke-linecap="round"/>
    <circle cx="${kx.toFixed(1)}" cy="${ky.toFixed(1)}" r="9" fill="var(--surface)" stroke="var(--accent)" stroke-width="4"/>
    <text x="${pt(min)[0]-6}" y="158" font-size="11" fill="var(--ink-3)" font-family="var(--body)">300</text>
    <text x="${pt(max)[0]-18}" y="158" font-size="11" fill="var(--ink-3)" font-family="var(--body)">850</text>
  </svg>`;
}
function trend(data){
  const W=560,H=200,pl=36,pr=12,pt=14,pb=26, lo=640,hi=730;
  const x=i=>pl+i*(W-pl-pr)/(data.length-1);
  const y=v=>pt+(hi-v)*(H-pt-pb)/(hi-lo);
  const line=data.map((d,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(d[1]).toFixed(1)}`).join(' ');
  const area=line+` L${x(data.length-1)} ${H-pb} L${x(0)} ${H-pb} Z`;
  const ticks=[650,680,710].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`).join('');
  const mon=data.map((d,i)=>i%2===0||i===data.length-1?`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${monShort(d[0]+'-01')}</text>`:'').join('');
  const last=data[data.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t('ov.trend',{a:data[0][1],b:last[1]}))}">
    ${ticks}
    <path d="${area}" fill="var(--accent)" opacity=".12"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(data.length-1)}" cy="${y(last[1])}" r="5" fill="var(--accent)"/>
    <text x="${x(data.length-1)-8}" y="${y(last[1])-10}" text-anchor="end" style="fill:var(--ink);font-weight:600">${last[1]}</text>
    ${mon}</svg>`;
}

/* ---------- Loan calculator ----------
   Annuity: equal monthly payment A = P·r / (1 − (1+r)^−n).
   Differentiated: equal principal P/n each month plus interest on the remaining balance. */
let calc={amount:5000000,period:3,unit:'years',rate:14,method:'annuity',showAll:false};
function schedule(P,n,rate,method){
  const r=rate/100/12, rows=[]; let bal=P;
  const A = r ? P*r/(1-Math.pow(1+r,-n)) : P/n;
  for(let m=1;m<=n;m++){
    const interest=bal*r;
    let principal = method==='annuity' ? A-interest : P/n;
    if(m===n) principal=bal;
    bal=Math.max(0,bal-principal);
    rows.push({m,payment:principal+interest,principal,interest,bal});
  }
  const interest=rows.reduce((s,x)=>s+x.interest,0);
  return {rows,interest,total:P+interest};
}
function calcInputs(){
  const P=calc.amount, n=calc.unit==='years'?Math.round(calc.period*12):Math.round(calc.period), e={};
  if(!(P>=10000&&P<=1e10)) e.amount=t('c.eAmount',{min:nf(10000),max:nf(1e10),cur:t('cur')});
  if(!(n>=1&&n<=480)) e.period=calc.unit==='years'?t('c.eYears'):t('c.eMonths');
  if(!(calc.rate>=0&&calc.rate<=100)) e.rate=t('c.eRate');
  return {P,n,e};
}
function viewCalc(){
  const c=calc;
  return `<div class="calc">
    <section class="panel">
      <h2>${t('c.title')}</h2>
      <form id="calcForm" novalidate>
        <div class="field"><label for="c-amount">${t('c.amount')}</label>
          <div class="affix"><input id="c-amount" data-calc="amount" inputmode="numeric" autocomplete="off" value="${nf(c.amount)}" aria-describedby="c-amount-e"><span>${t('cur')}</span></div>
          <span class="err" id="c-amount-e"></span></div>
        <div class="field"><label for="c-period">${t('c.period')}</label>
          <div class="combo"><input id="c-period" data-calc="period" type="number" inputmode="decimal" min="1" step="1" value="${c.period}" aria-describedby="c-period-e">
          <select data-calc="unit" aria-label="${esc(t('c.unit'))}"><option value="years" ${c.unit==='years'?'selected':''}>${t('c.years')}</option><option value="months" ${c.unit==='months'?'selected':''}>${t('c.months')}</option></select></div>
          <span class="err" id="c-period-e"></span></div>
        <div class="field"><label for="c-rate">${t('c.rate')}</label>
          <div class="affix"><input id="c-rate" data-calc="rate" type="number" inputmode="decimal" min="0" max="100" step="0.1" value="${c.rate}" aria-describedby="c-rate-e"><span>%</span></div>
          <span class="err" id="c-rate-e"></span></div>
        <fieldset class="seg-wrap"><legend>${t('c.method')}</legend><div class="seg">
          <label><input type="radio" name="method" value="annuity" data-calc="method" ${c.method==='annuity'?'checked':''}>${t('c.annuity')}</label>
          <label><input type="radio" name="method" value="diff" data-calc="method" ${c.method==='diff'?'checked':''}>${t('c.diff')}</label>
        </div></fieldset>
        <p class="hint" id="methodHint"></p>
      </form>
    </section>
    <div id="calcOut" aria-live="polite"></div>
  </div>
  <p class="note">${t('c.note')}</p>`;
}
function updateCalc(){
  const out=$('#calcOut'); if(!out) return;
  const {P,n,e}=calcInputs();
  ['amount','period','rate'].forEach(k=>{const el=$('#c-'+k+'-e'); if(el) el.textContent=e[k]||''; const f=$('#c-'+k); if(f){f.setAttribute('aria-invalid',!!e[k]); f.closest('.field').classList.toggle('bad',!!e[k]);}});
  $('#methodHint').textContent = calc.method==='annuity' ? t('c.hintA') : t('c.hintD');
  if(Object.keys(e).length){ out.innerHTML=`<section class="panel empty">${t('c.fix')}</section>`; return; }
  const res=schedule(P,n,calc.rate,calc.method), other=schedule(P,n,calc.rate,calc.method==='annuity'?'diff':'annuity');
  const first=res.rows[0].payment, last=res.rows.at(-1).payment, ip=res.total?res.interest/res.total*100:0;
  const saving=other.interest-res.interest, otherName=t(calc.method==='annuity'?'c.mD':'c.mA');
  const sub = calc.method==='annuity' ? t('c.forN',{n}) : (Math.round(first)===Math.round(last) ? t('c.every',{n}) : t('c.falling',{n,last:`<b class="num">${amd(last)}</b>`}));
  const headline=`<div class="eyebrow">${t('c.monthly')}</div><div class="big num">${amd(first)}</div><div class="sub">${sub}</div>`;
  const rows=calc.showAll||n<=12?res.rows:res.rows.slice(0,12);
  out.innerHTML=`<section class="panel">
      ${headline}
      <div class="stats">
        <div class="stat"><span class="v num">${nf(P)}</span><span class="l">${t('c.sLoan')}, ${t('cur')}</span></div>
        <div class="stat"><span class="v num">${nf(res.interest)}</span><span class="l">${t('c.sInterest')}, ${t('cur')}</span></div>
        <div class="stat"><span class="v num">${nf(res.total)}</span><span class="l">${t('c.sTotal')}, ${t('cur')}</span></div>
      </div>
      <div class="split" role="img" aria-label="${esc(t('c.split',{a:Math.round(100-ip),b:Math.round(ip)}))}"><i style="width:${100-ip}%;background:var(--ink-2)"></i><i style="width:${ip}%;background:var(--accent)"></i></div>
      <div class="legend"><span style="--c:var(--ink-2)">${t('c.lLoan',{n:Math.round(100-ip)})}</span><span style="--c:var(--accent)">${t('c.lInt',{n:Math.round(ip)})}</span></div>
      ${calc.rate>0&&n>1?`<div class="compare">${saving>0
        ? t('c.costMore',{m:otherName,amt:`<b class="num">${amd(saving)}</b>`})
        : t('c.save',{m:otherName,amt:`<b class="num">${amd(-saving)}</b>`,first:`<b class="num">${amd(other.rows[0].payment)}</b>`})}</div>`:''}
    </section>
    <section class="panel" style="margin-top:16px">
      <h2>${t('c.sched')}</h2>
      <div class="tbl"><table class="sched"><thead><tr><th>${t('c.thMonth')}</th><th>${t('c.thPay')}</th><th>${t('c.thPrin')}</th><th>${t('c.thInt')}</th><th>${t('c.thBal')}</th></tr></thead><tbody>
      ${rows.map(x=>`<tr><td class="num">${x.m}</td><td class="num"><b>${nf(x.payment)}</b></td><td class="num">${nf(x.principal)}</td><td class="num">${nf(x.interest)}</td><td class="num">${nf(x.bal)}</td></tr>`).join('')}
      </tbody></table></div>
      ${n>12?`<div class="swap" style="margin-top:12px"><button class="btn" type="button" data-calc-all>${calc.showAll?t('c.first12'):t('c.all',{n})}</button></div>`:''}
      <p class="sub" style="margin:10px 0 0">${t('c.allCur')}</p>
    </section>`;
}
function onCalcInput(el){
  const k=el.dataset.calc;
  if(k==='amount') calc.amount=Number(el.value.replace(/[^\d.]/g,''))||0;
  else if(k==='period'||k==='rate') calc[k]=el.value===''?NaN:Number(el.value);
  else if(k==='unit'){
    const months=calc.unit==='years'?calc.period*12:calc.period;
    calc.unit=el.value; calc.period=calc.unit==='years'?Math.round(months/12*10)/10:Math.round(months);
    const p=$('#c-period'); if(p) p.value=calc.period;
  }
  else if(k==='method') calc.method=el.value;
  updateCalc();
}
document.addEventListener('input',e=>{ const el=e.target.closest('[data-calc]'); if(el&&el.type!=='radio'&&el.tagName!=='SELECT') onCalcInput(el); });
document.addEventListener('change',e=>{ const el=e.target.closest('[data-calc]'); if(el&&(el.type==='radio'||el.tagName==='SELECT')) onCalcInput(el); });
document.addEventListener('focusout',e=>{ if(e.target.id==='c-amount'&&calc.amount) e.target.value=nf(calc.amount); });
document.addEventListener('submit',e=>{ if(e.target.id==='calcForm'){ e.preventDefault(); e.stopImmediatePropagation(); } },true);
document.addEventListener('click',e=>{ if(e.target.closest('[data-calc-all]')){ calc.showAll=!calc.showAll; updateCalc(); } });

/* ---------- Profile ---------- */
let prof={errors:{},saved:false,busy:false};
function viewProfile(){
  const u=user, e=prof.errors, active=LOANS.filter(l=>l.status!=='closed'), on=active.filter(l=>l.remind).length;
  const f=(id,label,val,err,extra='')=>`<div class="field ${err?'bad':''}"><label for="${id}">${label}</label><input id="${id}" value="${esc(val||'')}" ${extra} aria-invalid="${!!err}" aria-describedby="${id}-e"><span class="err" id="${id}-e">${err?esc(err):''}</span></div>`;
  return `<div class="prof">
    <section class="panel idcard">
      <span class="avatar lg" aria-hidden="true">${esc(initials(u.name))}</span>
      <h2>${esc(u.name)}</h2>
      <div class="sub">${esc(u.email)}</div>
      <dl class="facts">
        <div><dt>${t('p.since')}</dt><dd>${u.since?fmtDate(u.since):'-'}</dd></div>
        <div><dt>${t('p.consent')}</dt><dd>${u.consent?t('p.given',{d:fmtDate(u.consent)}):'-'}</dd></div>
        <div><dt>${t('p.reminders')}</dt><dd>${t('p.ofLoans',{a:on,n:active.length})}</dd></div>
        <div><dt>${t('p.where')}</dt><dd>${sb?t('p.inAcc'):t('p.inBrowser')}</dd></div>
      </dl>
    </section>
    <div class="grid">
      <section class="panel">
        <h2>${t('p.details')}</h2>
        <form id="profileForm" novalidate>
          ${f('p-name',t('fld.name'),u.name,e.name,'autocomplete="name"')}
          ${f('p-email',t('fld.email'),u.email,null,'type="email" readonly')}
          <p class="hint" style="margin-top:-8px">${t('p.emailHint')}</p>
          ${f('p-phone',t('fld.phone'),u.phone,e.phone,'type="tel" autocomplete="tel" placeholder="+374 XX XXX XXX"')}
          ${e.form?`<div class="field bad"><span class="err" role="alert">${esc(e.form)}</span></div>`:''}
          <div class="formrow"><button class="btn primary" type="submit" ${prof.busy?'disabled':''}>${prof.busy?t('p.saving'):t('p.save')}</button>${prof.saved?`<span class="saved" role="status">${t('p.saved')}</span>`:''}</div>
        </form>
      </section>
      <section class="panel">
        <h2>${t('p.remTitle')}</h2>
        <p class="sub" style="margin:0 0 12px">${t('p.remText',{a:on,n:active.length})}</p>
        <button class="btn" data-tab="loans">${t('p.manage')}</button>
      </section>
      <section class="panel">
        <h2>${t('signout')}</h2>
        <p class="sub" style="margin:0 0 12px">${sb?t('p.soDb'):t('p.soDemo')}</p>
        <button class="btn" data-signout>${t('signout')}</button>
      </section>
    </div>
  </div>`;
}
document.addEventListener('submit',async ev=>{
  if(ev.target.id!=='profileForm') return;
  ev.preventDefault(); ev.stopImmediatePropagation();
  if(prof.busy) return;
  const name=$('#p-name').value.trim(), phone=$('#p-phone').value.trim(), e={};
  if(name.split(/\s+/).filter(Boolean).length<2) e.name=t('e.name');
  if(!phoneOk(phone)) e.phone=t('e.phone');
  prof={errors:e,saved:false,busy:false};
  if(Object.keys(e).length){ render(); return; }
  prof.busy=true; render();
  if(sb){
    const {error}=await sb.from('profiles').update({full_name:name,phone}).eq('id',user.id);
    if(error){ prof={errors:{form:t('p.saveErr')+error.message},saved:false,busy:false}; render(); return; }
  }
  user={...user,name,phone};
  if(!sb){ try{localStorage.setItem('scoreup-user',JSON.stringify(user));}catch(_){} }
  prof={errors:{},saved:true,busy:false};
  $('#userName').textContent=user.name; $('#userAvatar').textContent=initials(user.name);
  render();
},true);

/* ---------- Tips ---------- */
function personalTips(){
  const out=[], active=LOANS.filter(l=>l.status!=='closed');
  const late=active.filter(l=>l.status==='late');
  late.forEach(l=>out.push(['bad','!',t('tp.late',{loan:t('loan.'+l.id),lender:lender(l.lender)}),t('tp.lateX',{amt:amd(l.monthly),n:l.daysLate}),'loans',t('tp.toLoans')]));
  const card=LOANS.find(l=>l.kind==='Card'&&l.status!=='closed');
  if(card){ const use=Math.round(card.balance/card.original*100);
    if(use>=30) out.push(['warn','%',t('tp.cardHigh'),t('tp.cardHighX',{n:use})]);
    else out.push(['good','✓',t('tp.cardOk'),t('tp.cardOkX',{n:use})]); }
  const hard=CHECKS.filter(c=>c.type==='Hard'&&daysUntil(c.date)>-365).length;
  if(hard>2) out.push(['warn','?',t('tp.pause'),t('tp.pauseX',{n:hard}),'inquiries',t('tp.toChecks')]);
  const off=active.filter(l=>!l.remind);
  if(off.length) out.push(['info','⏰',off.length===1?t('tp.remOne',{loan:t('loan.'+off[0].id)}):t('tp.remMany',{n:off.length}),t('tp.remX'),'loans',t('tp.toRem')]);
  if(!late.length) out.push(['good','✓',t('tp.noLate'),t('tp.noLateX')]);
  return out;
}
function viewTips(){
  const col={bad:['var(--bad)','var(--bad-soft)'],warn:['var(--warn)','var(--warn-soft)'],good:['var(--good)','var(--good-soft)'],info:['var(--ink-2)','var(--surface-2)']};
  return `<section class="panel">
    <h2>${t('tp.forYou')}</h2>
    <p class="sub" style="margin:0 0 14px">${t('tp.based')}</p>
    <div class="tip-you">${personalTips().map(x=>`<div class="tip-card" style="--c:${col[x[0]][0]};--cs:${col[x[0]][1]}">
      <span class="ic" aria-hidden="true">${x[1]}</span><b>${esc(x[2])}</b><p>${esc(x[3])}</p>
      ${x[4]?`<button class="btn" data-tab="${x[4]}">${esc(x[5])}</button>`:''}</div>`).join('')}</div>
  </section>
  <section class="panel tip-group">
    <h2>${t('tab.tips')}</h2>
    ${t('tips').map(([ic,title,bullets])=>`<details class="tip"><summary>${esc(title)}</summary><ul>${bullets.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></details>`).join('')}
  </section>
  <p class="note">${t('tp.note')}</p>`;
}

/* ---------- Render & events ---------- */
const VIEWS={overview:viewOverview,loans:viewLoans,inquiries:viewChecks,guarantees:viewGuarantees,calculator:viewCalc,tips:viewTips,alerts:viewAlerts,profile:viewProfile};
function render(){
  $('#view').innerHTML=VIEWS[state.tab]();
  if(state.tab==='calculator') updateCalc();
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.tab===state.tab));
  const me=$('.me'); if(me){ if(state.tab==='profile') me.setAttribute('aria-current','page'); else me.removeAttribute('aria-current'); }
  const u=ALERTS.filter(a=>!a.read).length, b=$('#alertBadge'); b.hidden=!u; b.textContent=u;
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]'); if(t){state.tab=t.dataset.tab; prof={errors:{},saved:false,busy:false}; try{history.replaceState(null,'','#'+state.tab)}catch(_){} render(); window.scrollTo(0,0); return;}
  const f=e.target.closest('[data-filter]'); if(f){state.loanFilter=f.dataset.filter; render(); return;}
  const p=e.target.closest('[data-pay]'); if(p){markPaid(LOANS.find(l=>l.id===p.dataset.pay)); persist(); render(); return;}
  if(e.target.closest('[data-readall]')){ALERTS.forEach(a=>a.read=true); persist(); render();}
});
document.addEventListener('change',e=>{
  const r=e.target.closest('[data-remind]'); if(r){LOANS.find(l=>l.id===r.dataset.remind).remind=r.checked; persist();}
});
/* ---------- Registration & sign-in ----------
   With Supabase configured: a real 6-digit code is emailed, and the profile and actions are saved in the database.
   Without it: demo mode, code 123456, nothing leaves this browser. */
const DEMO_CODE='123456';
let user=null;
let auth={mode:'register',step:1,form:{name:'',email:'',phone:''},errors:{}};
if(!sb){ try{ user=JSON.parse(localStorage.getItem('scoreup-user')||'null'); }catch(e){} }

const initials = n => n.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
function field(id,label,type,val,err,extra=''){
  return `<div class="field ${err?'bad':''}"><label for="${id}">${label}</label><input id="${id}" name="${id}" type="${type}" value="${esc(val)}" ${extra} aria-invalid="${!!err}" ${err?`aria-describedby="${id}-e"`:''}><span class="err" id="${id}-e">${err?esc(err):''}</span></div>`;
}
function submitBtn(label,busyLabel){
  return `<button class="btn primary wide" type="submit" ${auth.busy?'disabled aria-busy="true"':''}>${auth.busy?busyLabel:label}</button>`;
}
function authView(){
  const a=auth, f=a.form, e=a.errors;
  const demo=`<div class="demo">${sb?t('a.demoDb'):t('a.demo')}</div>`;
  const formErr=e.form?`<div class="field bad"><span class="err" role="alert">${esc(e.form)}</span></div>`:'';
  const top=`<div class="lang-top">${langSwitch()}</div>`;
  const brand=`<div class="brand"><div class="mark" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none"><path d="M2 12l4-4 3 3 5-6" stroke="#ff8a4c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>Score Up</div>`;
  if(a.step===2){
    const to=sb||a.mode!=='register'?f.email:f.phone;
    return `<div class="auth-card">${top}${brand}
      ${a.mode==='register'?`<div class="steps" aria-hidden="true"><i class="on"></i><i class="on"></i><i></i></div>`:''}
      <h1>${t('a.codeTitle')}</h1>
      <p class="lead">${t('a.sent',{to:esc(to)})}</p>
      ${demo}
      <form id="codeForm" novalidate>
        ${field('code',t('a.code'),'text','',e.code,'inputmode="numeric" maxlength="6" autocomplete="one-time-code" class="codebox" placeholder="······"')}
        ${sb?`<p class="sub" style="margin:-4px 0 14px">${t('a.inbox')}</p>`:`<p class="sub" style="margin:-4px 0 14px">${t('a.demoCode')} <b class="num">${DEMO_CODE}</b></p>`}
        ${formErr}
        ${submitBtn(a.mode==='register'?t('a.verify'):t('a.signin'),t('a.checking'))}
        <div class="swap"><button type="button" data-auth-back>${t('a.back')}</button></div>
      </form></div>`;
  }
  if(a.mode==='login'){
    return `<div class="auth-card">${top}${brand}
      <h1>${t('a.welcome')}</h1><p class="lead">${t('a.welcomeLead')}</p>${demo}
      <form id="loginForm" novalidate>
        ${field('email',t('fld.email'),'email',f.email,e.email,'autocomplete="email"')}
        ${formErr}
        ${submitBtn(t('a.sendCode'),t('a.sending'))}
        <div class="swap">${t('a.new')} <button type="button" data-auth-mode="register">${t('a.create')}</button></div>
      </form></div>`;
  }
  return `<div class="auth-card">${top}${brand}
    <div class="steps" aria-hidden="true"><i class="on"></i><i></i><i></i></div>
    <h1>${t('a.regTitle')}</h1><p class="lead">${t('a.regLead')}</p>${demo}
    <form id="regForm" novalidate>
      ${field('name',t('fld.name'),'text',f.name,e.name,'autocomplete="name"')}
      ${field('email',t('fld.email'),'email',f.email,e.email,'autocomplete="email"')}
      ${field('phone',t('fld.phone'),'tel',f.phone,e.phone,'autocomplete="tel" placeholder="+374 XX XXX XXX"')}
      <label class="check"><input type="checkbox" id="consent" ${f.consent?'checked':''}><span>${t('a.consent')}</span></label>
      ${e.consent?`<div class="field bad" style="margin-top:-8px"><span class="err">${esc(e.consent)}</span></div>`:''}
      ${formErr}
      ${submitBtn(t('a.continue'),t('a.sendingCode'))}
      <div class="swap">${t('a.have')} <button type="button" data-auth-mode="login">${t('a.signin')}</button></div>
    </form></div>`;
}
function showApp(){
  const signedIn=!!user;
  $('#auth').hidden=signedIn; $('#appHeader').hidden=!signedIn; $('#view').hidden=!signedIn;
  if(signedIn){
    $('#userName').textContent=user.name; $('#userAvatar').textContent=initials(user.name);
    applyStatic(); render();
  } else {
    $('#auth').innerHTML=authView();
    const first=$('#auth input:not([type=checkbox])'); if(first&&auth.focus!==false) first.focus();
  }
}
function readForm(){
  ['name','email','phone'].forEach(k=>{const el=$('#'+k,$('#auth')); if(el) auth.form[k]=el.value.trim();});
  const c=$('#consent'); if(c) auth.form.consent=c.checked;
}
const emailOk = s => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(s);
const phoneOk = s => s.replace(/[\s()-]/g,'').match(/^\+?\d{8,12}$/);
function validateReg(f){
  const e={};
  if(f.name.split(/\s+/).filter(Boolean).length<2) e.name=t('e.name');
  if(!emailOk(f.email)) e.email=t('e.email');
  if(!phoneOk(f.phone)) e.phone=t('e.phone');
  if(!f.consent) e.consent=t('e.consent');
  return e;
}

/* Database helpers */
function friendly(err){
  const m=(err&&err.message)||'';
  if(/signups not allowed|user not found/i.test(m)) return {email:t('e.noAcc')};
  if(/expired|invalid/i.test(m)) return {code:t('e.codeBad')};
  if(/rate limit|security purposes|too many/i.test(m)) return {form:t('e.tooMany')};
  return {form:t('e.generic')+(m||t('e.tryAgain'))};
}
async function loadUser(session){
  const u=session.user;
  const [{data:prof},{data:st}]=await Promise.all([
    sb.from('profiles').select('full_name,phone,consent_at,created_at').eq('id',u.id).maybeSingle(),
    sb.from('user_state').select('reminders,paid_loans,read_alerts').eq('user_id',u.id).maybeSingle()
  ]);
  if(st) applyPrefs({remind:st.reminders,paid:st.paid_loans,read:st.read_alerts});
  return {id:u.id,email:u.email,name:(prof&&prof.full_name)||u.email.split('@')[0],phone:(prof&&prof.phone)||'',consent:prof&&prof.consent_at,since:(prof&&prof.created_at)||u.created_at};
}
function sendCode(email,createUser){
  return sb.auth.signInWithOtp({email,options:{shouldCreateUser:createUser}});
}

async function handleSubmit(id){
  readForm();
  if(id==='regForm'){
    auth.errors=validateReg(auth.form);
    if(Object.keys(auth.errors).length) return;
    if(sb){ const {error}=await sendCode(auth.form.email,true); if(error){auth.errors=friendly(error); return;} }
    auth.step=2;
  } else if(id==='loginForm'){
    if(!emailOk(auth.form.email)){ auth.errors={email:t('e.email')}; return; }
    if(sb){ const {error}=await sendCode(auth.form.email,false); if(error){auth.errors=friendly(error); return;} auth.errors={}; auth.step=2; return; }
    let saved=null; try{saved=JSON.parse(localStorage.getItem('scoreup-user')||'null');}catch(_){}
    if(!saved||saved.email.toLowerCase()!==auth.form.email.toLowerCase()) auth.errors={email:t('e.noAccLocal')};
    else {auth.errors={}; auth.pending=saved; auth.step=2;}
  } else if(id==='codeForm'){
    const v=auth.code||'';
    if(sb){
      if(!/^\d{6}$/.test(v)){ auth.errors={code:t('e.code6')}; return; }
      const {data,error}=await sb.auth.verifyOtp({email:auth.form.email,token:v,type:'email'});
      if(error){ auth.errors=friendly(error); return; }
      if(auth.mode==='register'){
        const f=auth.form;
        const {error:pErr}=await sb.from('profiles').upsert({id:data.user.id,full_name:f.name,email:f.email,phone:f.phone,consent_at:new Date().toISOString()});
        if(pErr){ auth.errors={form:t('e.profileFail')+pErr.message}; return; }
      }
      user=await loadUser(data.session);
    } else {
      if(v!==DEMO_CODE){ auth.errors={code:t('e.demoCode')}; return; }
      const now=new Date().toISOString();
      user = auth.mode==='register' ? {name:auth.form.name,email:auth.form.email,phone:auth.form.phone,consent:now,since:now} : auth.pending;
      try{localStorage.setItem('scoreup-user',JSON.stringify(user));}catch(_){}
    }
    auth={mode:'register',step:1,form:{name:'',email:'',phone:''},errors:{}};
    state.tab='overview';
  }
}
document.addEventListener('submit',async ev=>{
  ev.preventDefault();
  if(auth.busy) return;
  const codeEl=$('#code'); auth.code=codeEl?codeEl.value.trim():'';
  auth.busy=true; auth.errors={}; readForm(); showApp();
  try{ await handleSubmit(ev.target.id); }
  catch(err){ auth.errors={form:t('e.generic')+(err.message||err)}; }
  auth.busy=false; showApp(); if(user) window.scrollTo(0,0);
});
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-lang]'); if(!b||!LANGS[b.dataset.lang]) return;
  if(!user) readForm();
  lang=b.dataset.lang; try{ localStorage.setItem('scoreup-lang',lang); }catch(_){}
  auth.errors={}; prof.errors={}; prof.saved=false; applyStatic(); showApp();
});
document.addEventListener('click',async ev=>{
  const m=ev.target.closest('[data-auth-mode]');
  if(m){readForm(); auth.mode=m.dataset.authMode; auth.step=1; auth.errors={}; showApp(); return;}
  if(ev.target.closest('[data-auth-back]')){auth.step=1; auth.errors={}; showApp(); return;}
  if(ev.target.closest('[data-signout]')){
    if(sb){ await sb.auth.signOut(); location.hash=''; location.reload(); return; }
    user=null; auth.mode='login'; auth.step=1; auth.errors={}; auth.form.email=''; showApp();
  }
});

const h=location.hash.slice(1); if(VIEWS[h]) state.tab=h;
applyStatic();
if(sb){
  sb.auth.getSession().then(async ({data})=>{
    if(data.session){ try{ user=await loadUser(data.session); }catch(e){ console.error(e); } }
    showApp();
  });
} else showApp();
</script>
